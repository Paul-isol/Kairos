services:
  postgres:
    image: postgres:16-alpine
    container_name: kairos-agentic-calender
    restart: unless-stopped
    ports:
      - "5440:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kairos-db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
